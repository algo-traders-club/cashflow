[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "cashflow"
version = "0.1.0"
description = "Autonomous spot trading system for USDC/HYPE on Hyperliquid"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
cashflow = "src.main:main"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
